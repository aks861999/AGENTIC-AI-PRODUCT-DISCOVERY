<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI Product Search, Live Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter:wght@300..700&display=swap" rel="stylesheet">
<style>
:root, [data-theme="light"] {
  --color-bg:              #f7f6f2;
  --color-surface:         #f9f8f5;
  --color-surface-2:       #fbfbf9;
  --color-surface-offset:  #f0ede8;
  --color-surface-dynamic: #e6e4df;
  --color-divider:         #dcd9d5;
  --color-border:          #d4d1ca;
  --color-text:            #1a1915;
  --color-text-muted:      #6b6a66;
  --color-text-faint:      #b0afa9;
  --color-text-inverse:    #f9f8f4;
  --color-primary:         #01696f;
  --color-primary-hover:   #0c4e54;
  --color-primary-highlight: #d0dedd;
  --color-success:         #2e6e12;
  --color-success-highlight: #d0ddc8;
  --color-warning:         #964219;
  --color-error:           #a12c7b;
  --color-console-bg:      #151613;
  --color-console-text:    #8ed490;
  --color-console-muted:   #586054;
  --color-console-info:    #5bbac6;
  --color-console-warn:    #eaaa48;
  --color-console-error:   #e0607a;
  --color-console-border:  #252823;
  --radius-sm: 0.375rem; --radius-md: 0.5rem; --radius-lg: 0.75rem;
  --radius-xl: 1rem; --radius-full: 9999px;
  --shadow-sm: 0 1px 2px oklch(0.2 0.01 80 / 0.06);
  --shadow-md: 0 4px 12px oklch(0.2 0.01 80 / 0.08);
  --shadow-lg: 0 12px 32px oklch(0.2 0.01 80 / 0.13);
  --shadow-xl: 0 24px 64px oklch(0.2 0.01 80 / 0.22);
  --transition: 160ms cubic-bezier(0.16, 1, 0.3, 1);
  --font-body: 'Inter', 'Helvetica Neue', sans-serif;
  --font-mono: 'Geist Mono', 'Fira Code', monospace;
  --text-xs:   clamp(0.72rem,  0.68rem + 0.22vw, 0.8rem);
  --text-sm:   clamp(0.8rem,   0.75rem + 0.28vw, 0.9rem);
  --text-base: clamp(0.9rem,   0.85rem + 0.28vw, 1rem);
  --text-lg:   clamp(1rem,     0.92rem + 0.45vw, 1.2rem);
  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem;
  --space-4: 1rem;    --space-5: 1.25rem; --space-6: 1.5rem;
  --space-8: 2rem;    --space-10: 2.5rem;
}
[data-theme="dark"] {
  --color-bg:              #111210;
  --color-surface:         #181714;
  --color-surface-2:       #1e1d1a;
  --color-surface-offset:  #252420;
  --color-surface-dynamic: #2c2b27;
  --color-divider:         #2a2927;
  --color-border:          #363530;
  --color-text:            #e0dfdb;
  --color-text-muted:      #8a8984;
  --color-text-faint:      #55544f;
  --color-text-inverse:    #1a1915;
  --color-primary:         #4fa8b0;
  --color-primary-hover:   #2d8e97;
  --color-primary-highlight: #1e3638;
  --color-success:         #5daa38;
  --color-success-highlight: #1e3318;
  --color-warning:         #e09050;
  --color-error:           #d46aaa;
  --color-console-bg:      #0c0d0b;
  --color-console-text:    #7ec87a;
  --color-console-muted:   #3e5039;
  --color-console-info:    #4db8c8;
  --color-console-warn:    #e8a040;
  --color-console-error:   #d85870;
  --color-console-border:  #181b16;
  --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.25);
  --shadow-md: 0 4px 12px oklch(0 0 0 / 0.35);
  --shadow-lg: 0 12px 32px oklch(0 0 0 / 0.45);
  --shadow-xl: 0 24px 64px oklch(0 0 0 / 0.55);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--font-body);font-size:var(--text-sm);background:var(--color-bg);color:var(--color-text);height:100dvh;overflow:hidden;display:flex;flex-direction:column}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px;border-radius:var(--radius-sm)}

/* Top Bar */
.topbar{height:48px;min-height:48px;background:var(--color-surface);border-bottom:1px solid var(--color-divider);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-4);gap:var(--space-4);flex-shrink:0;z-index:100}
.topbar-logo{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-base);font-weight:600;letter-spacing:-0.02em;color:var(--color-text)}
.topbar-logo svg{color:var(--color-primary)}
.topbar-status{display:flex;align-items:center;gap:var(--space-2);font-size:var(--text-xs);color:var(--color-text-muted)}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--color-text-faint);transition:background var(--transition)}
.status-dot.connected{background:var(--color-success);box-shadow:0 0 0 2px var(--color-success-highlight)}
.status-dot.error{background:var(--color-error)}
.topbar-actions{display:flex;align-items:center;gap:var(--space-2)}
.icon-btn{width:32px;height:32px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);transition:background var(--transition),color var(--transition)}
.icon-btn:hover{background:var(--color-surface-offset);color:var(--color-text)}
.api-badge{font-family:var(--font-mono);font-size:11px;color:var(--color-text-faint);background:var(--color-surface-offset);padding:2px 8px;border-radius:var(--radius-full);border:1px solid var(--color-border)}

/* Workspace */
.workspace{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* Console panel removed — logs shown inline */

/* Chat Panel */
.chat-panel{display:flex;flex-direction:column;overflow:hidden;background:var(--color-bg)}
.chat-header{padding:var(--space-3) var(--space-5);border-bottom:1px solid var(--color-divider);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;background:var(--color-surface)}
.chat-header-info{display:flex;flex-direction:column;gap:1px}
.chat-header-title{font-size:var(--text-sm);font-weight:600;color:var(--color-text)}
.chat-header-sub{font-size:var(--text-xs);color:var(--color-text-muted)}
.chat-hint{font-size:var(--text-xs);color:var(--color-text-faint);background:var(--color-surface-offset);padding:4px var(--space-3);border-radius:var(--radius-full);border:1px solid var(--color-border)}
.chat-messages{flex:1;overflow-y:auto;padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-4)}
.chat-messages::-webkit-scrollbar{width:4px}
.chat-messages::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:2px}

/* Messages */
.msg-row{display:flex;align-items:flex-end;gap:var(--space-2);opacity:0;transform:translateY(7px);animation:msgIn .22s cubic-bezier(.16,1,.3,1) forwards}
@keyframes msgIn{to{opacity:1;transform:translateY(0)}}
.msg-row.user{flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;font-weight:600}
.msg-avatar.bot{background:var(--color-primary-highlight);color:var(--color-primary)}
.msg-avatar.user{background:var(--color-surface-dynamic);color:var(--color-text-muted)}
.msg-content{max-width:72%;display:flex;flex-direction:column;gap:var(--space-2)}
.msg-bubble{padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);font-size:var(--text-sm);line-height:1.56;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);box-shadow:var(--shadow-sm)}
.msg-row.user .msg-bubble{background:var(--color-primary);color:var(--color-text-inverse);border-color:transparent;border-radius:var(--radius-lg) var(--radius-lg) var(--radius-sm) var(--radius-lg)}
.msg-row.bot  .msg-bubble{border-radius:var(--radius-lg) var(--radius-lg) var(--radius-lg) var(--radius-sm)}

/* Typing */
.typing-indicator{display:flex;align-items:center;gap:4px;padding:var(--space-2) 2px}
.typing-dot{width:5px;height:5px;border-radius:50%;background:var(--color-text-muted);animation:bounce 1.15s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.17s}
.typing-dot:nth-child(3){animation-delay:.34s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* Product Cards */
.results-grid{display:flex;flex-direction:column;gap:var(--space-2)}
.results-label{font-size:var(--text-xs);font-weight:500;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.07em;padding-bottom:var(--space-1)}
.product-card{background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);cursor:pointer;transition:border-color var(--transition),box-shadow var(--transition),transform var(--transition);display:flex;flex-direction:column;gap:var(--space-2);position:relative;overflow:hidden}
.product-card::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,oklch(from var(--color-primary) l c h / 0.05) 0%,transparent 55%);opacity:0;transition:opacity var(--transition);pointer-events:none}
.product-card:hover{border-color:var(--color-primary);box-shadow:var(--shadow-md),0 0 0 1px oklch(from var(--color-primary) l c h / 0.18);transform:translateY(-1px)}
.product-card:hover::after{opacity:1}
.product-card:active{transform:translateY(0)}
.product-card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2)}
.product-title{font-size:var(--text-sm);font-weight:600;color:var(--color-text);line-height:1.35;flex:1}
.product-id-badge{font-family:var(--font-mono);font-size:10px;color:var(--color-text-faint);background:var(--color-surface-offset);padding:2px 6px;border-radius:var(--radius-sm);flex-shrink:0;border:1px solid var(--color-border)}
.product-desc{font-size:var(--text-xs);color:var(--color-text-muted);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-attrs{display:flex;flex-wrap:wrap;gap:4px}
.attr-chip{font-size:11px;padding:2px 8px;border-radius:var(--radius-full);background:var(--color-primary-highlight);color:var(--color-primary);border:1px solid oklch(from var(--color-primary) l c h / 0.2);font-weight:500;white-space:nowrap}
.product-card-footer{display:flex;align-items:center;justify-content:flex-end;font-size:var(--text-xs);color:var(--color-text-faint);gap:4px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:oklch(.1 .005 80 / .65);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);z-index:500;display:flex;align-items:center;justify-content:center;padding:var(--space-6);opacity:0;pointer-events:none;transition:opacity .2s ease}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);width:100%;max-width:580px;max-height:82dvh;display:flex;flex-direction:column;overflow:hidden;transform:translateY(18px) scale(.97);transition:transform .22s cubic-bezier(.16,1,.3,1)}
.modal-overlay.open .modal-box{transform:translateY(0) scale(1)}
.modal-header{padding:var(--space-4) var(--space-5);border-bottom:1px solid var(--color-divider);display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);flex-shrink:0}
.modal-header-info{display:flex;flex-direction:column;gap:var(--space-1)}
.modal-title{font-size:var(--text-base);font-weight:600;color:var(--color-text);line-height:1.3}
.modal-uid{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-muted)}
.modal-close{width:32px;height:32px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;color:var(--color-text-muted);flex-shrink:0;transition:background var(--transition),color var(--transition)}
.modal-close:hover{background:var(--color-surface-offset);color:var(--color-text)}
.modal-body{flex:1;overflow-y:auto;padding:var(--space-5);display:flex;flex-direction:column;gap:var(--space-5)}
.modal-body::-webkit-scrollbar{width:4px}
.modal-body::-webkit-scrollbar-thumb{background:var(--color-border);border-radius:2px}
.modal-section-label{font-size:var(--text-xs);font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-muted);margin-bottom:var(--space-2)}
.modal-desc{font-size:var(--text-sm);color:var(--color-text-muted);line-height:1.65}
.modal-bullets{display:flex;flex-direction:column;gap:var(--space-2)}
.modal-bullet{display:flex;gap:var(--space-2);font-size:var(--text-sm);color:var(--color-text-muted);line-height:1.5}
.modal-bullet::before{content:'–';color:var(--color-primary);flex-shrink:0;font-weight:500}
.attr-table{width:100%;border-collapse:collapse}
.attr-table tr{border-bottom:1px solid var(--color-divider)}
.attr-table tr:last-child{border-bottom:none}
.attr-table td{padding:var(--space-2) var(--space-3);font-size:var(--text-sm);vertical-align:top}
.attr-table td:first-child{font-weight:500;color:var(--color-text-muted);width:45%;font-size:var(--text-xs);padding-top:10px}
.attr-table td:last-child{color:var(--color-text)}
.attr-table tr:nth-child(odd) td{background:oklch(from var(--color-surface-offset) l c h / 0.5)}

/* Input */
.chat-input-area{padding:var(--space-3) var(--space-5) var(--space-4);border-top:1px solid var(--color-divider);background:var(--color-surface);flex-shrink:0}
.chat-input-row{display:flex;gap:var(--space-2);align-items:flex-end}
.chat-input{flex:1;background:var(--color-surface-2);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-3) var(--space-4);font-size:var(--text-sm);color:var(--color-text);resize:none;outline:none;transition:border-color var(--transition),box-shadow var(--transition);line-height:1.5;min-height:44px;max-height:120px;overflow-y:auto}
.chat-input::placeholder{color:var(--color-text-faint)}
.chat-input:focus{border-color:var(--color-primary);box-shadow:0 0 0 3px oklch(from var(--color-primary) l c h / 0.12)}
.chat-input:disabled{opacity:.45}
.send-btn{width:44px;height:44px;border-radius:var(--radius-lg);background:var(--color-primary);color:var(--color-text-inverse);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background var(--transition),transform var(--transition),opacity var(--transition)}
.send-btn:hover{background:var(--color-primary-hover)}
.send-btn:active{transform:scale(.93)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.input-meta{display:flex;justify-content:space-between;align-items:center;margin-top:var(--space-2);font-size:11px;color:var(--color-text-faint)}
.quick-chips{display:flex;gap:6px;flex-wrap:wrap}
.quick-chip{font-size:11px;padding:3px 10px;border-radius:var(--radius-full);border:1px solid var(--color-border);color:var(--color-text-muted);background:var(--color-surface-offset);transition:border-color var(--transition),color var(--transition),background var(--transition);white-space:nowrap;cursor:pointer}
.quick-chip:hover{border-color:var(--color-primary);color:var(--color-primary);background:var(--color-primary-highlight)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border-width:0}


/* ── MOBILE RESPONSIVENESS ───────────────────────────────────── */

@media (max-width: 768px) {

  /* Chat panel takes full width */
  .chat-panel { width: 100%; min-width: 0; }

  /* Chat header adjustments */
  .chat-header { padding: var(--space-2) var(--space-3); flex-wrap: wrap; gap: var(--space-2); }
  .chat-header-sub { font-size: 10px; }
  .chat-hint { display: none; }

  /* Messages area */
  .chat-messages { padding: var(--space-3); gap: var(--space-3); }

  /* Message bubbles — wider on mobile */
  .msg-content { max-width: 86%; }
  .msg-row.bot .msg-content { max-width: 92%; }

  /* Input area */
  .chat-input-area { padding: var(--space-2) var(--space-3) var(--space-3); }
  .chat-input { padding: var(--space-2) var(--space-3); font-size: var(--text-sm); }

  /* Quick chips: horizontal scroll on mobile */
  .quick-chips {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    gap: 5px;
    padding-bottom: 2px;
  }
  .quick-chips::-webkit-scrollbar { display: none; }
  .quick-chip { flex-shrink: 0; }

  /* Product cards in messages */
  .product-card { padding: var(--space-2) var(--space-3); }

  /* Modal — full screen on mobile */
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal-box {
    max-width: 100%;
    width: 100%;
    max-height: 90dvh;
    border-radius: var(--radius-xl) var(--radius-xl) 0 0;
    border-bottom: none;
  }
  .modal-header { padding: var(--space-3) var(--space-4); }
  .modal-body { padding: var(--space-4); }
  /* Drag handle visual cue */
  .modal-box::before {
    content: '';
    display: block;
    width: 36px; height: 4px;
    background: var(--color-border);
    border-radius: 2px;
    margin: var(--space-2) auto 0;
    flex-shrink: 0;
  }
}

/* Tablet: narrow two-column */
@media (min-width: 769px) and (max-width: 1024px) {
  .chat-hint { display: none; }
  .api-badge { display: none; }
}

/* ── Thinking / Reasoning Block ───────────────────────────────── */
.thinking-block {
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  background: var(--color-surface-offset);
  overflow: hidden;
  margin-bottom: var(--space-2);
}
.thinking-header {
  padding: 7px 12px;
  cursor: pointer;
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  user-select: none;
  font-family: var(--font-mono);
  letter-spacing: 0.02em;
}
.thinking-header::-webkit-details-marker { display: none; }
.thinking-header:hover { color: var(--color-text); background: var(--color-surface-dynamic); }
.thinking-header .th-icon { font-size: 13px; }
.thinking-header .th-label { flex: 1; }
.thinking-header .th-chevron {
  margin-left: auto;
  color: var(--color-text-faint);
  transition: transform 0.28s ease;
  font-size: 11px;
}
details[open] > .thinking-header .th-chevron { transform: rotate(90deg); }
details[open] > .thinking-header { color: var(--color-text); border-bottom: 1px solid var(--color-border); }

.thinking-content {
  max-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: max-height 0.35s ease, opacity 0.28s ease;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--color-text-muted);
  line-height: 1.65;
}
details[open] .thinking-content {
  max-height: 420px;
  overflow-y: auto;
  opacity: 1;
}
.thinking-content::-webkit-scrollbar { width: 3px; }
.thinking-content::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 2px; }
.thinking-line {
  display: flex;
  gap: 8px;
  padding: 2px 14px;
  border-bottom: none;
}
.thinking-line:first-child { padding-top: 10px; }
.thinking-line:last-child  { padding-bottom: 10px; }
.th-ts { color: var(--color-text-faint); flex-shrink: 0; font-size: 10px; padding-top: 1px; }
.th-msg { color: var(--color-console-text); word-break: break-word; }
.th-msg.type-info  { color: var(--color-console-info); }
.th-msg.type-warn  { color: var(--color-console-warn); }
.th-msg.type-error { color: var(--color-console-error); }
.th-msg.type-result{ color: #96e07c; }
.th-msg.type-llm   { color: #c8a8f8; }
.th-msg.type-filter{ color: #f4c85a; }
.th-msg.type-dim   { color: var(--color-text-faint); opacity: 0.7; }
.th-msg.type-step  { color: var(--color-console-text); }

/* Spinning brain icon while thinking */
.thinking-spinning .th-icon { display: inline-block; animation: th-spin 1.2s linear infinite; }
@keyframes th-spin { to { transform: rotate(360deg); } }

</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-logo">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-label="KI Search">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M11 8v6M8 11h6" stroke-linecap="round"/>
    </svg>
    KI Product Search
  </div>
  <div class="topbar-status">
    <span class="status-dot" id="statusDot"></span>
    <span id="statusText">Checking API…</span>
    <span class="api-badge" id="apiUrlBadge">Deployed on EC2</span>
  </div>
  <div class="topbar-actions">
    <button class="icon-btn" data-theme-toggle aria-label="Toggle theme" title="Toggle dark/light mode">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="icon-btn" id="clearChatBtn" aria-label="Clear chat" title="Clear chat">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/>
      </svg>
    </button>
  </div>
</header>

<main class="workspace">
<section class="chat-panel" aria-label="Chat">
    <div class="chat-header">
      <div class="chat-header-info">
        <div class="chat-header-title">Home Improvement Assistant</div>
        <div class="chat-header-sub">Hybrid semantic + BM25 · OpenSearch AWS · Gemini 2.5 Flash · LangGraph</div>
      </div>
      <span class="chat-hint">Click any product card to view full specs</span>
    </div>

    <div class="chat-messages" id="chatMessages" role="log" aria-live="polite"></div>

    <div class="chat-input-area">
      <div class="chat-input-row">
        <label for="chatInput" class="sr-only">Search for products</label>
        <textarea id="chatInput" class="chat-input" placeholder='Try: "Find me paint with color/finish Moth Gray"' rows="1" autocomplete="off"></textarea>
        <button class="send-btn" id="sendBtn" aria-label="Send" title="Send (Enter)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
      <div class="input-meta">
        <div class="quick-chips" id="quickChips">
          <button class="quick-chip" data-q="Find me paint with color/finish Moth Gray">🎨 Moth Gray paint</button>
          <button class="quick-chip" data-q="Show me galvanized steel pipe clamps">🔩 Pipe clamps</button>
          <button class="quick-chip" data-q="2x4 pressure treated lumber 8 foot">🪵 Treated lumber</button>
          <button class="quick-chip" data-q="cordless drill 20V battery included">🔋 Cordless drill 20V</button>
          <button class="quick-chip" data-q="ceramic floor tile white 12x12">🟫 Floor tile</button>
        </div>
        <span id="charCount" style="flex-shrink:0;padding-left:8px"></span>
      </div>
    </div>
  </section>

</main>

<div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-hidden="true">
  <div class="modal-box" id="modalBox">
    <div class="modal-header">
      <div class="modal-header-info">
        <div class="modal-title" id="modalTitle">Product Details</div>
        <div class="modal-uid"  id="modalUid"></div>
      </div>
      <button class="modal-close" id="modalClose" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>

// ── Per-query Thinking Block ──────────────────────────────────
let _thinkingLogs = [];   // buffer for current query
let _thinkingBlock = null; // current <details> DOM node
let _thinkingContent = null;
let _thinkingHeader  = null;
let _thinkingStart   = 0;

function pad2(n){ return String(n).padStart(2,'0'); }
function ts(){const d=new Date();return `${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function startThinkingBlock(parentEl) {
  _thinkingLogs = [];
  _thinkingStart = Date.now();

  const details = document.createElement('details');
  details.className = 'thinking-block thinking-spinning';
  details.setAttribute('open', '');

  details.innerHTML = `
    <summary class="thinking-header">
      <span class="th-icon">⟳</span>
      <span class="th-label">Thinking…</span>
      <span class="th-chevron">▸</span>
    </summary>
    <div class="thinking-content"></div>`;

  _thinkingBlock   = details;
  _thinkingHeader  = details.querySelector('.thinking-header');
  _thinkingContent = details.querySelector('.thinking-content');
  parentEl.appendChild(details);
  return details;
}

function addThinkingLine(msg, type) {
  if (!_thinkingContent) return;
  _thinkingLogs.push({ msg, type });
  const line = document.createElement('div');
  line.className = 'thinking-line';
  line.innerHTML = `<span class="th-ts">${ts()}</span><span class="th-msg type-${type}">${escHtml(msg)}</span>`;
  _thinkingContent.appendChild(line);
  _thinkingContent.scrollTop = _thinkingContent.scrollHeight;
}

function finaliseThinkingBlock(hitCount) {
  if (!_thinkingBlock) return;
  const elapsed = ((Date.now() - _thinkingStart) / 1000).toFixed(1);
  _thinkingBlock.classList.remove('thinking-spinning');
  _thinkingHeader.querySelector('.th-icon').textContent = '🧠';
  _thinkingHeader.querySelector('.th-label').textContent =
    `Thought for ${elapsed}s · ${hitCount} product${hitCount !== 1 ? 's' : ''} found`;
  // Auto-collapse after answer is rendered
  setTimeout(() => { _thinkingBlock.removeAttribute('open'); }, 600);
  _thinkingBlock   = null;
  _thinkingContent = null;
  _thinkingHeader  = null;
}


const API_BASE   = '';
const SESSION_ID = 'demo-' + Math.random().toString(36).slice(2, 10);
let isLoading    = false;

// ── Theme ─────────────────────────────────────────────────────
(function(){
  const btn = document.querySelector('[data-theme-toggle]');
  const root= document.documentElement;
  let mode  = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
  root.setAttribute('data-theme', mode);
  const MOON = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
  const SUN  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
  if(btn) btn.addEventListener('click', ()=>{
    mode = mode==='dark'?'light':'dark';
    root.setAttribute('data-theme', mode);
    btn.innerHTML = mode==='dark' ? MOON : SUN;
  });
})();

// ── Console ───────────────────────────────────────────────────

function clog(msg, type='step'){ /* logs now shown inline as thinking blocks */ }
function csep(){ /* no-op */ }



// ── Health Check ──────────────────────────────────────────────
const statusDot  = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');

async function checkHealth(){
  try{
    clog(`GET ${API_BASE}/health`, 'step');
    const r = await fetch(`${API_BASE}/health`, { signal: AbortSignal.timeout(4000) });
    if(r.ok){
      statusDot.className   = 'status-dot connected';
      statusText.textContent = 'API online';
      clog('✓ API is online, ready to search', 'result');
      const data = await r.json().catch(()=>({}));
      if(data.version) clog(`  version: ${data.version}  opensearch: ${data.opensearch}`, 'dim');
    } else {
      throw new Error('HTTP '+r.status);
    }
  } catch(e){
    statusDot.className   = 'status-dot error';
    statusText.textContent = 'API online';
    clog(`✗ Health check failed: ${e.message}`, 'error');
    clog('  Run: uvicorn api.main:app --reload --port 8000', 'warn');
  }
}
checkHealth();

// ── Init messages ─────────────────────────────────────────────
const messagesEl = document.getElementById('chatMessages');

function appendWelcome(){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `
    <div class="msg-avatar bot" aria-hidden="true">K</div>
    <div class="msg-content">
      <div class="msg-bubble">
        Hi! I'm your home improvement product assistant powered by <strong>hybrid semantic + BM25 search</strong> on AWS OpenSearch.<br><br>
        Try a natural language query, e.g. <em>"Find me paint with color/finish Moth Gray"</em>, or tap a quick chip below.
        <br><br><span style="color:var(--color-text-faint);font-size:var(--text-xs)">Session: ${escHtml(SESSION_ID)}</span>
      </div>
    </div>`;
  messagesEl.appendChild(row);
}
appendWelcome();
csep();
clog(`Session: ${SESSION_ID}`, 'dim');
clog('Waiting for first query…', 'dim');

// ── Input handling ────────────────────────────────────────────
const chatInput = document.getElementById('chatInput');
const sendBtn   = document.getElementById('sendBtn');
const charCount = document.getElementById('charCount');

chatInput.addEventListener('input', ()=>{
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
  const n = chatInput.value.length;
  charCount.textContent = n > 10 ? `${n}/2000` : '';
});
chatInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); doSend(); }
});
sendBtn.addEventListener('click', doSend);

document.querySelectorAll('.quick-chip').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    chatInput.value = btn.dataset.q;
    chatInput.dispatchEvent(new Event('input'));
    doSend();
  });
});

document.getElementById('clearChatBtn').addEventListener('click', ()=>{
  messagesEl.innerHTML = '';
  appendWelcome();
});

// ── Send ──────────────────────────────────────────────────────
async function doSend(){
  const text = chatInput.value.trim();
  if(!text || isLoading) return;

  isLoading = true;
  chatInput.value = '';
  chatInput.style.height = 'auto';
  charCount.textContent = '';
  chatInput.disabled = true;
  sendBtn.disabled   = true;

  appendUserMsg(text);

  // Create typing row + attach thinking block to it
  const typingRow = appendTyping();
  const thinkingContainer = typingRow.querySelector('.msg-content');
  startThinkingBlock(thinkingContainer);

  addThinkingLine(`► Query: "${text.slice(0,75)}${text.length>75?'…':''}"`, 'info');

  const t0 = Date.now();

  try{
    addThinkingLine(`POST ${API_BASE}/chat`, 'step');
    const res = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, sessionid: SESSION_ID })
    });

    const elapsed = Date.now() - t0;
    addThinkingLine('── OpenSearch hybrid pipeline ──', 'step');
    addThinkingLine('  search_pipeline: hybrid-search-pipeline', 'dim');
    addThinkingLine('  KNN weight: 0.6  BM25 weight: 0.4  k=150', 'dim');
    addThinkingLine('  Embedding: BAAI/bge-small-en-v1.5 (dim=384)', 'dim');
    addThinkingLine(`← HTTP ${res.status}  ${elapsed}ms`, res.ok ? 'result' : 'error');

    if(!res.ok) throw new Error(`HTTP ${res.status}`);

    const data = await res.json();

    // ── Render real backend trace into thinking block ──
    if (data.debug && Array.isArray(data.debug.trace) && data.debug.trace.length > 0) {
      data.debug.trace.forEach(entry => {
        addThinkingLine(entry.msg, entry.type || 'step');
      });
    } else {
      // Graceful fallback for any query type where trace is empty
      addThinkingLine('Pipeline executed (no trace data returned)', 'dim');
    }

    const hits = (data.results && data.results.length) || 0;
    finaliseThinkingBlock(hits);
    typingRow.remove();
    appendBotMessage(data.reply || 'No response.', data.results || []);





    typingRow.remove();
    appendBotMessage(data.reply || 'No response.', data.results || []);

  } catch(err){
    const elapsed = Date.now() - t0;
    addThinkingLine(`✗ Error after ${elapsed}ms: ${err.message}`, 'error');
    addThinkingLine('  Is uvicorn running? Check terminal.', 'warn');
    finaliseThinkingBlock(0);
    typingRow.remove();
    appendUserMsg2bot('Could not reach the API. Make sure the server is running on port 8000.');
  } finally{
    isLoading = false;
    chatInput.disabled = false;
    sendBtn.disabled   = false;
    chatInput.focus();
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

// ── Message builders ──────────────────────────────────────────
function appendUserMsg(text){
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="msg-avatar user" aria-hidden="true">U</div>
    <div class="msg-content">
      <div class="msg-bubble">${escHtml(text)}</div>
    </div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendUserMsg2bot(text){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `
    <div class="msg-avatar bot" aria-hidden="true">K</div>
    <div class="msg-content">
      <div class="msg-bubble" style="color:var(--color-error)">${escHtml(text)}</div>
    </div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function appendBotMessage(replyText, results){
  const row = document.createElement('div');
  row.className = 'msg-row bot';

  let cardsHtml = '';
  if(results && results.length > 0){
    const cards = results.slice(0,6).map((p,i)=>buildCard(p,i)).join('');
    cardsHtml = `
      <div class="results-grid" role="list">
        <div class="results-label">${results.length} product${results.length!==1?'s':''} found, click any card for full specs</div>
        ${cards}
      </div>`;
  }

  row.innerHTML = `
    <div class="msg-avatar bot" aria-hidden="true">K</div>
    <div class="msg-content" style="max-width:90%">
      <div class="msg-bubble">${escHtml(replyText)}</div>
      ${cardsHtml}
    </div>`;

  messagesEl.appendChild(row);

  if(results && results.length > 0){
    row.querySelectorAll('.product-card').forEach((card, idx)=>{
      const p = results[idx];
      card.addEventListener('click', ()=>openModal(p));
      card.addEventListener('keydown', e=>{
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openModal(p); }
      });
    });
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function buildCard(p, idx){
  const title  = escHtml(p.title || 'Untitled Product');
  const uid    = escHtml(p.productuid || p.id || '—');
  const desc   = escHtml((p.productdescription||'').slice(0,115));
  const attrs  = (p.attributes||[]).slice(0,3)
    .map(a=>`<span class="attr-chip">${escHtml(a.name)}: ${escHtml(a.value)}</span>`)
    .join('');
  return `
    <div class="product-card" role="listitem" tabindex="0" aria-label="View specs for ${title}">
      <div class="product-card-header">
        <div class="product-title">${title}</div>
        <div class="product-id-badge">#${uid}</div>
      </div>
      ${desc?`<div class="product-desc">${desc}…</div>`:''}
      ${attrs?`<div class="product-attrs">${attrs}</div>`:''}
      <div class="product-card-footer">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
        </svg>
        View all specifications
      </div>
    </div>`;
}

function appendTyping(){
  const row = document.createElement('div');
  row.className = 'msg-row bot';
  row.innerHTML = `
    <div class="msg-avatar bot" aria-hidden="true">K</div>
    <div class="msg-content">
      <div class="msg-bubble">
        <div class="typing-indicator" aria-label="Thinking">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
        </div>
      </div>
    </div>`;
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return row;
}

// ── Modal ─────────────────────────────────────────────────────
const modalOverlay = document.getElementById('modalOverlay');
const modalBox     = document.getElementById('modalBox');
const modalClose   = document.getElementById('modalClose');
const modalTitle   = document.getElementById('modalTitle');
const modalUid     = document.getElementById('modalUid');
const modalBody    = document.getElementById('modalBody');

function openModal(p){
  const title   = p.title || 'Untitled Product';
  const uid     = p.productuid || p.id || '—';
  const desc    = p.productdescription || '';
  const bullets = p.bulletpoints || [];
  const attrs   = p.attributes   || [];

  modalTitle.textContent = title;
  modalUid.textContent   = `Product ID: ${uid}`;

  let html = '';

  if(desc){
    html += `<div>
      <div class="modal-section-label">Description</div>
      <p class="modal-desc">${escHtml(desc)}</p>
    </div>`;
  }

  if(bullets.length > 0){
    const items = bullets.map(b=>`<div class="modal-bullet">${escHtml(b)}</div>`).join('');
    html += `<div>
      <div class="modal-section-label">Product Features</div>
      <div class="modal-bullets">${items}</div>
    </div>`;
  }

  if(attrs.length > 0){
    const rows = attrs.map(a=>
      `<tr><td>${escHtml(a.name)}</td><td>${escHtml(a.value)}</td></tr>`
    ).join('');
    html += `<div>
      <div class="modal-section-label">Full Specifications, ${attrs.length} attributes</div>
      <table class="attr-table" aria-label="All product specifications">
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  if(!html) html = `<p class="modal-desc">No additional details for this product.</p>`;

  modalBody.innerHTML = html;
  modalOverlay.setAttribute('aria-hidden','false');
  modalOverlay.classList.add('open');
  modalClose.focus();

  clog(`Modal: #${uid} opened, ${attrs.length} specs loaded`, 'info');
}

function closeModal(){
  modalOverlay.setAttribute('aria-hidden','true');
  modalOverlay.classList.remove('open');
}


// Log stream removed: per-query thinking blocks replace global SSE stream
checkHealth();




modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', e=>{ if(e.target===modalOverlay) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

modalBox.addEventListener('keydown', e=>{
  if(e.key!=='Tab') return;
  const focusable = [...modalBox.querySelectorAll('button,[tabindex]:not([tabindex="-1"])')];
  if(!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length-1];
  if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
});

chatInput.focus();



</script>

</body>
</html>
